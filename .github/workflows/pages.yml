name: Deploy Browser UI To Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser_ui/package-lock.json

      - name: Compute Vite Base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "${REPO_NAME}" = "${OWNER}.github.io" ]; then
            echo "BCR_UI_BASE=/" >> "$GITHUB_ENV"
          else
            echo "BCR_UI_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Build Browser UI (Demo Mode)
        working-directory: browser_ui
        env:
          VITE_DEMO_NO_BACKEND: "true"
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser_ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
